name: capture-bybit-real-fixtures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture real Bybit responses
        run: python scripts/capture_bybit_fixtures.py

      - name: Commit fixtures if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/bybit
          if git diff --cached --quiet; then
            echo "No fixture changes"
          else
            git commit -m "test: capture real Bybit API fixtures"
            git push
          fi
